[package]
name = "floresta-proc-macro"
version = "0.1.0"
description = "Procedural macros for the Floresta project"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "=1.0.107"
syn = { version = "=3.0.9", features = ["full"] }
quote = "=1.0.47"

[features]
default = []
async = []

[lints]
workspace = true